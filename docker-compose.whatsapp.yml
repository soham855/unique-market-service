services:
  unique-market-whatsapp:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp
    container_name: unique-market-whatsapp
    restart: unless-stopped
    init: true
    ports:
      - "10000:10000"
    env_file:
      - .env.whatsapp
    environment:
      NODE_ENV: production
      PORT: 10000
      WA_AUTH_DIR: /app/whatsapp-bot/auth_info
    volumes:
      - unique-market-wa-auth:/app/whatsapp-bot/auth_info
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:10000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  unique-market-wa-auth:
    name: unique-market-wa-auth
