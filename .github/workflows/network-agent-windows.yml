name: Network Agent Windows Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'network-agent/**'
      - '.github/workflows/network-agent-windows.yml'

jobs:
  build-windows-agent:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: network-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build standalone EXE
        run: npx @yao-pkg/pkg@6.7.0 agent.js --targets node20-win-x64 --output UniqueMarketNetworkAgent.exe

      - name: Package installer files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item UniqueMarketNetworkAgent.exe dist/
          Copy-Item install-agent.bat dist/
          Copy-Item README-WINDOWS.md dist/
          Compress-Archive -Path dist/* -DestinationPath UniqueMarketNetworkAgent-Windows.zip -Force

      - name: Upload Windows agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniqueMarketNetworkAgent-Windows
          path: network-agent/UniqueMarketNetworkAgent-Windows.zip
          if-no-files-found: error
