name: Unique Market Auto-Heal Monitor

on:
  workflow_run:
    workflows:
      - "Android APK"
      - "Android AAB"
      - "Flutter Android"
      - "Network Agent Windows"
      - "Workspace Reminder Android"
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Download failed run logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p auto-heal
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/logs" \
            -o auto-heal/logs.zip
          unzip -q -o auto-heal/logs.zip -d auto-heal/logs
          find auto-heal/logs -type f -print0 | xargs -0 cat > auto-heal/combined.log || true
          tail -c 20000 auto-heal/combined.log > auto-heal/error.log

      - name: Create diagnostic issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.event.workflow_run.html_url }}"
          TITLE="Auto-Heal: failed deployment/workflow ${{ github.event.workflow_run.name }}"
          BODY="$(cat auto-heal/error.log)"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body "## Unique Market Auto-Heal Diagnostic

Failed workflow: $RUN_URL

The error log captured from the failed run:

```
$BODY
```

This issue is intentionally diagnostic-only until the AI repair agent is enabled."
