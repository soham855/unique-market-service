name: Flutter Android Build
# Admin release includes registered-email OTP fallback for email-only Admin Auth accounts.

on:
  pull_request:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-android.yml'
      - 'supabase/migrations/**'
  push:
    branches: [main, 'fix/customer-otp-account-linking']
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-android.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Create Android project shell
        run: |
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --project-name instant_services --org com.uniquemarket --platforms android .
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "com.uniquemarket.instant_services"/applicationId = "com.uniquemarket.instantservices"/' android/app/build.gradle.kts
            sed -i 's/namespace = "com.uniquemarket.instant_services"/namespace = "com.uniquemarket.instantservices"/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId "com.uniquemarket.instant_services"/applicationId "com.uniquemarket.instantservices"/' android/app/build.gradle
            sed -i 's/namespace "com.uniquemarket.instant_services"/namespace "com.uniquemarket.instantservices"/' android/app/build.gradle
          else
            echo "Android Gradle project was not generated."
            exit 1
          fi

      - name: Align Android launcher package with application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path("android/app/src/main").rglob("*"):
              if path.is_file() and path.name in ("MainActivity.kt", "MainActivity.java"):
                  content = path.read_text()
                  content = content.replace(
                      "com.uniquemarket.instant_services",
                      "com.uniquemarket.instantservices",
                  )
                  path.write_text(content)
                  print(f"Updated {path}")
          PY
          grep -R 'package com.uniquemarket.instantservices' android/app/src/main

      - name: Remove generated Flutter sample test
        run: |
          # flutter create adds this scaffold test when no project test suite exists.
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart && ! grep -Rqs 'class MyApp' lib; then
            rm test/widget_test.dart
          fi

      - name: Generate launcher icon PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 assets/app_icon.svg -o assets/app_icon.png
          test -s assets/app_icon.png

      - name: Configure Android notification permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST" || sed -i '/<manifest[^>]*>/a\\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' "$MANIFEST"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST" || sed -i '/<manifest[^>]*>/a\\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>' "$MANIFEST"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST" || sed -i '/<manifest[^>]*>/a\\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' "$MANIFEST"

      - name: Configure Google Services plugin
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i '/id("org.jetbrains.kotlin.android") version/a\\    id("com.google.gms.google-services") version "4.4.3" apply false' android/settings.gradle.kts
            sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          elif [ -f android/settings.gradle ]; then
            sed -i "/id 'org.jetbrains.kotlin.android' version/a\\    id 'com.google.gms.google-services' version '4.4.3' apply false" android/settings.gradle
            sed -i "/id 'dev.flutter.flutter-gradle-plugin'/a\\    id 'com.google.gms.google-services'" android/app/build.gradle
          fi

      - name: Verify Firebase configuration
        run: |
          test -f android/app/google-services.json
          grep -q '"package_name": "com.uniquemarket.instantservices"' android/app/google-services.json

      - name: Get packages
        run: |
          flutter pub get
          PROPS=android/gradle/wrapper/gradle-wrapper.properties
          if [ -f "$PROPS" ]; then
            grep -q '^networkTimeout=' "$PROPS" && sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$PROPS" || echo 'networkTimeout=120000' >> "$PROPS"
          fi

      - name: Generate Android launcher icons
        run: |
          RES=android/app/src/main/res
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "$RES/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" assets/app_icon.svg -o "$RES/mipmap-$density/ic_launcher.png"
            cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
          done
          mkdir -p "$RES/drawable"
          rsvg-convert -w 432 -h 432 assets/app_icon.svg -o "$RES/drawable/ic_launcher_foreground.png"
          mkdir -p "$RES/mipmap-anydpi-v26"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=SUPABASE_URL=https://tfscvycomllamoubtlcf.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_VeJIjcsILLniCHf2HjA20A_xlMydma0

      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=https://tfscvycomllamoubtlcf.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_VeJIjcsILLniCHf2HjA20A_xlMydma0

      - name: Build release AAB
        run: flutter build appbundle --release --dart-define=SUPABASE_URL=https://tfscvycomllamoubtlcf.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_VeJIjcsILLniCHf2HjA20A_xlMydma0

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: instant-services-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: instant-services-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: instant-services-release-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Configure separate Admin app package
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          gradle_kts = Path("android/app/build.gradle.kts")
          gradle = Path("android/app/build.gradle")
          target = gradle_kts if gradle_kts.exists() else gradle
          content = target.read_text().replace("com.uniquemarket.instantservices", "com.uniquemarket.admin")
          target.write_text(content)
          for path in Path("android/app/src/main").rglob("*"):
              if path.is_file() and path.name in ("MainActivity.kt", "MainActivity.java"):
                  path.write_text(path.read_text().replace("com.uniquemarket.instantservices", "com.uniquemarket.admin"))
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              manifest.write_text(manifest.read_text().replace('android:label="instant_services"', 'android:label="Unique Market Admin"'))
          # Admin uses Supabase auth, not Firebase. The Android build currently applies
          # Google Services globally, so create a build-only matching client entry.
          # This file is ephemeral on the runner and never committed or deployed.
          firebase = Path("android/app/google-services.json")
          config = json.loads(firebase.read_text())
          for client in config.get("client", []):
              client.setdefault("client_info", {}).setdefault("android_client_info", {})["package_name"] = "com.uniquemarket.admin"
          firebase.write_text(json.dumps(config, indent=2) + "\n")
          PY
          grep -R 'com.uniquemarket.admin' android/app/build.gradle* android/app/src/main
          grep -q '"package_name": "com.uniquemarket.admin"' android/app/google-services.json

      - name: Build separate Admin release APK
        run: flutter build apk --release --target lib/admin_main.dart --dart-define=SUPABASE_URL=https://tfscvycomllamoubtlcf.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_VeJIjcsILLniCHf2HjA20A_xlMydma0

      - name: Upload Admin release APK
        uses: actions/upload-artifact@v4
        with:
          name: unique-market-admin-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
