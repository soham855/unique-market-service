name: Technician Support Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/technician-support-system]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check WhatsApp bot syntax
        run: node --check whatsapp-bot/server.mjs
      - name: Build web portal
        run: npm run build
