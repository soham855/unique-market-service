name: Technician Support Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/technician-support-system]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check service report OTP Edge Function
        run: deno check --no-lock --node-modules-dir=auto supabase/functions/service-report-otp/index.ts
      - name: Type-check cash payment OTP Edge Function
        run: deno check --no-lock --node-modules-dir=auto supabase/functions/cash-payment-otp/index.ts
      - name: Check WhatsApp bot syntax
        run: node --check whatsapp-bot/server.mjs
      - name: Build web portal
        run: npm run build
