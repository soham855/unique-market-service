name: Build Instant Services Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Add Android platform
        run: npx cap add android
      - name: Configure Firebase and notification permission
        run: |
          cp flutter_app/android/app/google-services.json android/app/google-services.json
          node - <<'NODE'
          const fs=require('fs')
          const manifest='android/app/src/main/AndroidManifest.xml'
          let x=fs.readFileSync(manifest,'utf8')
          if(!x.includes('android.permission.POST_NOTIFICATIONS')) x=x.replace('<manifest','<manifest\\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />')
          fs.writeFileSync(manifest,x)
          if(fs.existsSync('android/settings.gradle.kts')){
            let s=fs.readFileSync('android/settings.gradle.kts','utf8')
            if(!s.includes('com.google.gms.google-services')) s=s.replace('plugins {','plugins {\\n    id("com.google.gms.google-services") version "4.4.3" apply false')
            fs.writeFileSync('android/settings.gradle.kts',s)
            let a=fs.readFileSync('android/app/build.gradle.kts','utf8')
            if(!a.includes('com.google.gms.google-services')) a=a.replace('plugins {','plugins {\\n    id("com.google.gms.google-services")')
            fs.writeFileSync('android/app/build.gradle.kts',a)
          } else {
            let s=fs.readFileSync('android/settings.gradle','utf8')
            if(!s.includes('com.google.gms.google-services')) s=s.replace('plugins {','plugins {\\n    id \'com.google.gms.google-services\' version \'4.4.3\' apply false')
            fs.writeFileSync('android/settings.gradle',s)
            let a=fs.readFileSync('android/app/build.gradle','utf8')
            if(!a.includes('com.google.gms.google-services')) a=a.replace('plugins {','plugins {\\n    id \'com.google.gms.google-services\'')
            fs.writeFileSync('android/app/build.gradle',a)
          }
          NODE
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Ensure precise Android location permissions
        run: node scripts/ensure-android-location.mjs
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instant-services-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
