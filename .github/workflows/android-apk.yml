name: Build Instant Services Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Add Android platform
        run: npx cap add android
      - name: Configure Firebase and notification permission
        run: |
          cp flutter_app/android/app/google-services.json android/app/google-services.json
          node -e "const fs=require('fs'); const p='android/app/src/main/AndroidManifest.xml'; let x=fs.readFileSync(p,'utf8'); if(!x.includes('android.permission.POST_NOTIFICATIONS')) x=x.replace('<manifest', '<manifest\\n    <uses-permission android:name=\\\"android.permission.POST_NOTIFICATIONS\\\" />'); fs.writeFileSync(p,x)"
          node -e "const fs=require('fs'); const p='android/app/build.gradle'; if(fs.existsSync(p)){let x=fs.readFileSync(p,'utf8'); if(!x.includes('com.google.gms.google-services')) x=x.replace('plugins {','plugins {\\n    id \\\'com.google.gms.google-services\\\''); fs.writeFileSync(p,x)}"
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Ensure precise Android location permissions
        run: node scripts/ensure-android-location.mjs
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instant-services-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
