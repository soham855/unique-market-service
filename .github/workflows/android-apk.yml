name: Build Instant Services Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Security audit (full dependency tree)
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const advisories = Object.values(report.vulnerabilities || {});
            console.log("Audit totals:", JSON.stringify(report.metadata?.vulnerabilities || {}));
            for (const item of advisories) {
              console.log(JSON.stringify({
                name: item.name,
                severity: item.severity,
                isDirect: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: item.via
              }, null, 2));
            }
            if (!advisories.length) console.log("No dependency vulnerabilities found.");
          '
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-audit
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Build web app
        run: npm run build
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Add Android platform
        run: npx cap add android
      - name: Configure Firebase
        run: cp flutter_app/android/app/google-services.json android/app/google-services.json
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Ensure Android permissions
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const p='android/app/src/main/AndroidManifest.xml'
          let x=fs.readFileSync(p,'utf8')
          for (const permission of ['android.permission.POST_NOTIFICATIONS']) {
            const tag='    <uses-permission android:name="'+permission+'" />'
            if(!x.includes(tag)) x=x.replace(/<manifest[^>]*>/, m=>m+'\n'+tag)
          }
          fs.writeFileSync(p,x)
          NODE
          node scripts/ensure-android-location.mjs
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instant-services-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
