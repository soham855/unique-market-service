name: Workspace Reminder Android

on:
  push:
    paths:
      - 'workspace-reminder/**'
      - '.github/workflows/workspace-reminder-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace-reminder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --project-name workspace_reminder --org com.workspacereminder --platforms android
      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = '''\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n'''
          marker = '<manifest '
          i = s.find('>', s.find(marker))
          if i >= 0 and 'ACCESS_BACKGROUND_LOCATION' not in s:
              s = s[:i+1] + perms + s[i+1:]
          p.write_text(s)
          PY
      - name: Get packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Build release APK
        run: flutter build apk --release
      - name: Build release AAB
        run: flutter build appbundle --release
      - name: Upload APKs and AAB
        uses: actions/upload-artifact@v4
        with:
          name: workspace-reminder-android
          path: |
            workspace-reminder/build/app/outputs/flutter-apk/app-debug.apk
            workspace-reminder/build/app/outputs/flutter-apk/app-release.apk
            workspace-reminder/build/app/outputs/bundle/release/app-release.aab
